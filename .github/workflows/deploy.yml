name: Deploy to Cloudflare Pages

# Plain checkout. Jaettu koodi on vendoroitu src/shared/:aan (2026-08-21),
# joten cross-repo PAT (LV_MONOREPO_TOKEN) ei ole enaa tarpeen.
# Ala koskaan muokkaa src/shared/:n tiedostoja kasin — kayta sync-sharedia.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lapland-blog --branch=main
